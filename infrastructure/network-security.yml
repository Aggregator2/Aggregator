# Network Security Policies and Firewall Configuration
# Kubernetes Network Policies for Real-time Data Feeds System

apiVersion: v1
kind: Namespace
metadata:
  name: realtime-feeds
  labels:
    security.policy: strict
    monitoring: enabled
---
# Default Deny All Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: realtime-feeds
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# Real-time Feeds Application Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: realtime-feeds-policy
  namespace: realtime-feeds
spec:
  podSelector:
    matchLabels:
      app: realtime-feeds
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from load balancer
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8443
  # Allow WebSocket connections from verified sources
  - from:
    - podSelector:
        matchLabels:
          role: websocket-client
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow egress to DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow egress to database
  - to:
    - podSelector:
        matchLabels:
          app: postgresql
    ports:
    - protocol: TCP
      port: 5432
  # Allow egress to Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow HTTPS egress for external APIs
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
---
# Database Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-policy
  namespace: realtime-feeds
spec:
  podSelector:
    matchLabels:
      app: postgresql
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Only allow ingress from application pods
  - from:
    - podSelector:
        matchLabels:
          app: realtime-feeds
    ports:
    - protocol: TCP
      port: 5432
  # Allow monitoring access
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9187
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
---
# Redis Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-policy
  namespace: realtime-feeds
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Only allow ingress from application pods
  - from:
    - podSelector:
        matchLabels:
          app: realtime-feeds
    ports:
    - protocol: TCP
      port: 6379
  # Allow monitoring access
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9121
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
---
# Monitoring Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-policy
  namespace: realtime-feeds
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow access from Grafana
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app: grafana
    ports:
    - protocol: TCP
      port: 9090
  # Allow access from external monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 9090
  egress:
  # Allow scraping metrics from all pods
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9187
    - protocol: TCP
      port: 9121
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
---
# Security Scanning Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: security-scanner-policy
  namespace: realtime-feeds
spec:
  podSelector:
    matchLabels:
      app: security-scanner
  policyTypes:
  - Egress
  egress:
  # Allow scanning application endpoints
  - to:
    - podSelector:
        matchLabels:
          app: realtime-feeds
    ports:
    - protocol: TCP
      port: 8080
  # Allow external security API access
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53