apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: dex-platform
type: Opaque
stringData:
  JWT_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    # This would be populated from AWS Secrets Manager
    # Use ExternalSecrets or similar operator in production
    -----END PRIVATE KEY-----
  JWT_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    # This would be populated from AWS Secrets Manager
    -----END PUBLIC KEY-----
  REDIS_PASSWORD: "redis-auth-token-from-secrets-manager"
  DATABASE_URL: "postgresql://user:pass@aurora-endpoint:5432/dex_platform"
  TOTP_SECRET: "totp-secret-from-secrets-manager"
  SMS_API_KEY: "sms-provider-api-key"
  EMAIL_API_KEY: "email-provider-api-key"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: dex-platform
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  REDIS_CLUSTER_ENABLED: "true"
  REDIS_HOST: "redis-cluster-endpoint"
  REDIS_PORT: "6379"
  JWT_ALGORITHM: "RS256"
  JWT_EXPIRES_IN: "3600"
  SESSION_TTL: "3600000"
  MAX_SESSIONS_PER_USER: "5"
  ENABLE_2FA: "true"
  ENABLE_WALLET_AUTH: "true"
  ENABLE_API_KEYS: "true"
  RATE_LIMIT_WINDOW: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"