apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dex-platform-ingress
  namespace: dex-platform
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:region:account:certificate/cert-id"
    alb.ingress.kubernetes.io/ssl-policy: "ELBSecurityPolicy-TLS-1-2-2017-01"
    alb.ingress.kubernetes.io/security-groups: "sg-auth-alb"
    alb.ingress.kubernetes.io/wafv2-acl-arn: "arn:aws:wafv2:region:account:regional/webacl/name/id"
    alb.ingress.kubernetes.io/healthcheck-path: "/health"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    # CORS headers
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.dex-platform.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  rules:
  - host: api.dex-platform.com
    http:
      paths:
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: authentication-service
            port:
              number: 80
      - path: /sessions
        pathType: Prefix
        backend:
          service:
            name: session-manager-service
            port:
              number: 80
      - path: /wallet
        pathType: Prefix
        backend:
          service:
            name: wallet-auth-service
            port:
              number: 80
      - path: /rbac
        pathType: Prefix
        backend:
          service:
            name: rbac-service
            port:
              number: 80
      - path: /health
        pathType: Exact
        backend:
          service:
            name: authentication-service
            port:
              number: 80
  tls:
  - hosts:
    - api.dex-platform.com
    secretName: dex-platform-tls
---
apiVersion: v1
kind: Secret
metadata:
  name: dex-platform-tls
  namespace: dex-platform
type: kubernetes.io/tls
data:
  tls.crt: # Base64 encoded certificate
  tls.key: # Base64 encoded private key