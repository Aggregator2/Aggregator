<svg width="200" height="150" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Laptop frame -->
  <rect x="20" y="20" width="160" height="100" rx="10" fill="#A8D5E2" stroke="#1a1a2e" stroke-width="4"/>
  
  <!-- Screen -->
  <rect x="30" y="30" width="140" height="80" fill="white" stroke="#1a1a2e" stroke-width="3"/>
  
  <!-- Laptop base -->
  <path d="M 10 120 L 190 120 L 180 130 L 20 130 Z" fill="#A8D5E2" stroke="#1a1a2e" stroke-width="4"/>
  
  <!-- Trackpad -->
  <rect x="85" y="124" width="30" height="3" rx="1" fill="#1a1a2e"/>
  
  <!-- Coin on screen -->
  <g transform="translate(100, 70)">
    <!-- Coin background -->
    <circle cx="0" cy="0" r="30" fill="#FFD700" stroke="#1a1a2e" stroke-width="3"/>
    
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="24" fill="#FFC700" opacity="0.6"/>
    
    <!-- Eyes -->
    <circle cx="-10" cy="-8" r="3" fill="#1a1a2e"/>
    <circle cx="10" cy="-8" r="3" fill="#1a1a2e"/>
    
    <!-- Eye highlights -->
    <circle cx="-9" cy="-9" r="1.5" fill="white"/>
    <circle cx="11" cy="-9" r="1.5" fill="white"/>
    
    <!-- Smile -->
    <path d="M -12 5 Q 0 15 12 5" stroke="#1a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Coin edge markings -->
    <g opacity="0.7">
      <rect x="28" y="-3" width="4" height="6" rx="1" fill="#E5B800"/>
      <rect x="28" y="-12" width="4" height="6" rx="1" fill="#E5B800"/>
      <rect x="28" y="6" width="4" height="6" rx="1" fill="#E5B800"/>
    </g>
  </g>
</svg>