<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Coin background -->
  <circle cx="50" cy="50" r="45" fill="#FFD700" stroke="#1a1a2e" stroke-width="4"/>
  
  <!-- Inner circle for depth -->
  <circle cx="50" cy="50" r="38" fill="#FFC700" opacity="0.6"/>
  
  <!-- Eyes -->
  <circle cx="35" cy="40" r="5" fill="#1a1a2e"/>
  <circle cx="65" cy="40" r="5" fill="#1a1a2e"/>
  
  <!-- Eye highlights -->
  <circle cx="36" cy="38" r="2" fill="white"/>
  <circle cx="66" cy="38" r="2" fill="white"/>
  
  <!-- Smile -->
  <path d="M 30 55 Q 50 70 70 55" stroke="#1a1a2e" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Coin edge effect -->
  <path d="M 95 50 A 45 45 0 0 1 50 95" fill="none" stroke="#E5B800" stroke-width="2" opacity="0.5"/>
</svg>