;; ==========================================
;; SwappiQ Protocol PgBouncer Configuration
;; ==========================================

[databases]
;; Main database pool
swappiq_main = host=localhost port=5432 dbname=swappiq user=swappiq_app

;; Read replica pool for queries
swappiq_read = host=localhost port=5432 dbname=swappiq user=swappiq_readonly

;; Analytics database pool
swappiq_analytics = host=localhost port=5432 dbname=swappiq user=swappiq_analytics pool_mode=statement max_db_connections=5

;; Migration database (no pooling)
swappiq_migration = host=localhost port=5432 dbname=swappiq user=swappiq_admin pool_mode=session max_db_connections=2

[pgbouncer]
;; ==========================================
;; Connection Settings
;; ==========================================

;; Listen on all interfaces
listen_addr = *
listen_port = 6432

;; Unix socket for local connections
unix_socket_dir = /var/run/postgresql
unix_socket_mode = 0777

;; ==========================================
;; Authentication
;; ==========================================

auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
auth_query = SELECT username, password FROM pgbouncer.user_lookup($1)

;; Admin users
admin_users = pgbouncer_admin, swappiq_admin

;; Stats users
stats_users = stats, pgbouncer_monitor, swappiq_monitor

;; ==========================================
;; Pool Configuration
;; ==========================================

;; Pool modes:
;; - session: default, full PostgreSQL session
;; - transaction: connection returned after transaction
;; - statement: connection returned after statement
pool_mode = transaction

;; Maximum number of client connections
max_client_conn = 10000

;; Default pool size per user/database pair
default_pool_size = 25

;; Minimum pool size
min_pool_size = 10

;; Maximum pool size when needed
reserve_pool_size = 10

;; Reserve pool timeout
reserve_pool_timeout = 5

;; Maximum number of connections to any database
max_db_connections = 100

;; Maximum number of connections per user
max_user_connections = 100

;; ==========================================
;; Performance Settings
;; ==========================================

;; Disable query cancellation handling
disable_pqexec = 0

;; TCP socket buffer size
pkt_buf = 4096

;; Listen queue size
listen_backlog = 512

;; TCP keepalive
tcp_keepalive = 1
tcp_keepidle = 300
tcp_keepintvl = 30
tcp_keepcnt = 3

;; DNS lookup settings
dns_max_ttl = 15.0
dns_nxdomain_ttl = 15.0
dns_zone_check_period = 0

;; ==========================================
;; Timeouts
;; ==========================================

;; Queries running longer than this are canceled
query_timeout = 300

;; Time to wait for query completion before canceling
query_wait_timeout = 30

;; Client connection idle timeout
client_idle_timeout = 600

;; Client login timeout
client_login_timeout = 60

;; Server connection idle timeout
server_idle_timeout = 600

;; Server connection lifetime
server_lifetime = 3600

;; Server connection timeout
server_connect_timeout = 15

;; Server login retry interval
server_login_retry = 15

;; How long to keep released connections
server_reset_pool = 20

;; ==========================================
;; Logging
;; ==========================================

;; Log file settings
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

;; Syslog settings
syslog = 1
syslog_ident = pgbouncer
syslog_facility = daemon

;; Log verbosity
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1

;; Statistics logging period
stats_period = 60

;; ==========================================
;; Security
;; ==========================================

;; TLS/SSL settings
;server_tls_sslmode = require
;server_tls_protocols = secure
;server_tls_ciphers = HIGH:MEDIUM:+3DES:!aNULL

;; Client TLS
;client_tls_sslmode = prefer
;client_tls_protocols = secure
;client_tls_ciphers = HIGH:MEDIUM:+3DES:!aNULL

;; Certificate files
;client_tls_cert_file = /etc/pgbouncer/client.crt
;client_tls_key_file = /etc/pgbouncer/client.key
;client_tls_ca_file = /etc/pgbouncer/ca.crt

;; ==========================================
;; Monitoring
;; ==========================================

;; Application name to use for connections
application_name_add_host = 1

;; Track extra parameters
track_extra_parameters = IntervalStyle, search_path

;; Ignore startup parameters
ignore_startup_parameters = extra_float_digits, options

;; ==========================================
;; Maintenance
;; ==========================================

;; Server reset query
server_reset_query = DISCARD ALL

;; Server reset query for session pooling
server_reset_query_always = 0

;; Server check query
server_check_query = select 1

;; Server check delay
server_check_delay = 30

;; ==========================================
;; Advanced Settings
;; ==========================================

;; Maximum packet size
max_packet_size = 2147483647

;; SO_REUSEPORT setting
so_reuseport = 1

;; Autodb settings for dynamic database connections
autodb_idle_timeout = 3600

;; Cancel wait time
cancel_wait_timeout = 10

;; Suspend timeout
suspend_timeout = 10