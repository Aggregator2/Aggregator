name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '18'

jobs:
  # ==========================================
  # DEPENDENCY SCANNING
  # ==========================================
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk vulnerability scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on=upgradable
        continue-on-error: true

      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: snyk.sarif
        continue-on-error: true

      - name: Run npm audit
        run: npm audit --audit-level=high --json > audit-results.json
        continue-on-error: true

      - name: Process audit results
        run: |
          if [ -f audit-results.json ]; then
            HIGH_VULNS=$(jq '.metadata.vulnerabilities.high // 0' audit-results.json)
            CRITICAL_VULNS=$(jq '.metadata.vulnerabilities.critical // 0' audit-results.json)
            
            echo "## NPM Audit Results" >> $GITHUB_STEP_SUMMARY
            echo "- **Critical vulnerabilities**: $CRITICAL_VULNS" >> $GITHUB_STEP_SUMMARY
            echo "- **High vulnerabilities**: $HIGH_VULNS" >> $GITHUB_STEP_SUMMARY
            
            if [ "$CRITICAL_VULNS" -gt 0 ] || [ "$HIGH_VULNS" -gt 0 ]; then
              echo "::warning::Found high or critical vulnerabilities in dependencies"
            fi
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: npm-audit-results
          path: audit-results.json

  # ==========================================
  # STATIC APPLICATION SECURITY TESTING (SAST)
  # ==========================================
  sast-scan:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/nodejs
            p/typescript
            p/react
            p/express
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep results to GitHub
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: semgrep.sarif

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v2
        with:
          languages: javascript, typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

      - name: Secret scanning with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

  # ==========================================
  # SMART CONTRACT SECURITY
  # ==========================================
  contract-security:
    name: Smart Contract Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Compile contracts
        run: |
          if [ -d "contracts" ]; then
            cd contracts
            forge build
          else
            echo "No contracts directory found"
          fi
        continue-on-error: true

      - name: Run Slither static analysis
        uses: crytic/slither-action@v0.3.0
        id: slither
        with:
          node-version: ${{ env.NODE_VERSION }}
          solc-version: 0.8.19
          target: 'contracts/'
          slither-args: '--print human-summary --json slither-report.json'
        continue-on-error: true

      - name: Upload Slither report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: slither-report
          path: slither-report.json

      - name: Run Mythril analysis
        run: |
          if [ -d "contracts" ]; then
            pip install mythril
            find contracts -name "*.sol" -exec myth analyze {} \; > mythril-report.txt || echo "Mythril analysis completed with warnings"
          fi
        continue-on-error: true

      - name: Upload Mythril report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: mythril-report
          path: mythril-report.txt

      - name: Run Echidna fuzzing (if available)
        run: |
          if [ -f "echidna.yaml" ] && [ -d "contracts" ]; then
            docker run -it -v $PWD:/src trailofbits/echidna:latest /src/contracts --config /src/echidna.yaml
          else
            echo "Echidna configuration not found, skipping fuzzing tests"
          fi
        continue-on-error: true

  # ==========================================
  # CONTAINER SECURITY
  # ==========================================
  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t settlement-queue:security-scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'settlement-queue:security-scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Docker Scout (if available)
        run: |
          if command -v docker-scout &> /dev/null; then
            docker scout cves settlement-queue:security-scan --format sarif --output docker-scout-results.sarif
          else
            echo "Docker Scout not available, skipping"
          fi
        continue-on-error: true

      - name: Run Hadolint Dockerfile linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: true

      - name: Upload Hadolint results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: hadolint-results.sarif

  # ==========================================
  # LICENSE COMPLIANCE
  # ==========================================
  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install license checker
        run: npm install -g license-checker

      - name: Check licenses
        run: |
          license-checker --json --out license-report.json
          license-checker --summary

      - name: Check for prohibited licenses
        run: |
          # Define prohibited licenses
          PROHIBITED_LICENSES=("GPL-2.0" "GPL-3.0" "AGPL-1.0" "AGPL-3.0")
          
          for license in "${PROHIBITED_LICENSES[@]}"; do
            if grep -q "$license" license-report.json; then
              echo "::error::Prohibited license found: $license"
              exit 1
            fi
          done
          
          echo "✅ No prohibited licenses found"

      - name: Upload license report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: license-report
          path: license-report.json

  # ==========================================
  # SECURITY POLICY COMPLIANCE
  # ==========================================
  compliance-check:
    name: Security Policy Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check security policy exists
        run: |
          if [ ! -f "SECURITY.md" ]; then
            echo "::warning::SECURITY.md file not found. Consider adding a security policy."
          else
            echo "✅ Security policy found"
          fi

      - name: Check for sensitive files
        run: |
          SENSITIVE_FILES=(".env" "config.json" "secrets.yml" "private.key" "id_rsa")
          FOUND_SENSITIVE=false
          
          for file in "${SENSITIVE_FILES[@]}"; do
            if find . -name "$file" -not -path "./.git/*" | grep -q .; then
              echo "::error::Sensitive file found: $file"
              FOUND_SENSITIVE=true
            fi
          done
          
          if [ "$FOUND_SENSITIVE" = true ]; then
            echo "::error::Sensitive files detected in repository"
            exit 1
          else
            echo "✅ No sensitive files found"
          fi

      - name: Check for hardcoded secrets patterns
        run: |
          # Common secret patterns
          PATTERNS=(
            "password\s*=\s*['\"][^'\"]{8,}['\"]"
            "api_key\s*=\s*['\"][^'\"]{16,}['\"]"
            "secret\s*=\s*['\"][^'\"]{16,}['\"]"
            "token\s*=\s*['\"][^'\"]{16,}['\"]"
            "private_key\s*=\s*['\"][^'\"]{32,}['\"]"
          )
          
          SECRETS_FOUND=false
          
          for pattern in "${PATTERNS[@]}"; do
            if grep -r -i -E "$pattern" --include="*.js" --include="*.ts" --include="*.json" --exclude-dir=node_modules .; then
              echo "::warning::Potential hardcoded secret pattern found: $pattern"
              SECRETS_FOUND=true
            fi
          done
          
          if [ "$SECRETS_FOUND" = false ]; then
            echo "✅ No obvious hardcoded secret patterns found"
          fi

  # ==========================================
  # SECURITY SUMMARY
  # ==========================================
  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, sast-scan, contract-security, container-security, license-check, compliance-check]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: security-artifacts

      - name: Generate security summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} | Snyk + NPM Audit |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST Analysis | ${{ needs.sast-scan.result }} | Semgrep + CodeQL |" >> $GITHUB_STEP_SUMMARY
          echo "| Contract Security | ${{ needs.contract-security.result }} | Slither + Mythril |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Security | ${{ needs.container-security.result }} | Trivy + Hadolint |" >> $GITHUB_STEP_SUMMARY
          echo "| License Check | ${{ needs.license-check.result }} | License compliance |" >> $GITHUB_STEP_SUMMARY
          echo "| Policy Compliance | ${{ needs.compliance-check.result }} | Security policies |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count successful vs failed scans
          SUCCESS_COUNT=0
          FAILURE_COUNT=0
          
          for result in "${{ needs.dependency-scan.result }}" "${{ needs.sast-scan.result }}" "${{ needs.contract-security.result }}" "${{ needs.container-security.result }}" "${{ needs.license-check.result }}" "${{ needs.compliance-check.result }}"; do
            if [ "$result" = "success" ]; then
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              FAILURE_COUNT=$((FAILURE_COUNT + 1))
            fi
          done
          
          echo "### Overall Security Status" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Passed**: $SUCCESS_COUNT scans" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ **Failed**: $FAILURE_COUNT scans" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ $FAILURE_COUNT -eq 0 ]; then
            echo "🎉 **All security scans passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Some security scans failed. Please review the results.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify security team on failures
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: "🚨 Security scan failures detected in ${{ github.repository }}"
          webhook_url: ${{ secrets.SECURITY_SLACK_WEBHOOK }}
        continue-on-error: true