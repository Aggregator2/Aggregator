name: Secrets Rotation Automation

on:
  schedule:
    # Run every Sunday at 3 AM UTC for weekly rotation
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      rotation_type:
        description: 'Type of rotation to perform'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard
          - emergency
          - compliance
      force_rotation:
        description: 'Force rotation even if not due'
        required: false
        default: false
        type: boolean

env:
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
  VAULT_NAMESPACE: ${{ secrets.VAULT_NAMESPACE }}

jobs:
  # Pre-rotation validation
  pre-rotation-checks:
    name: Pre-Rotation Security Checks
    runs-on: ubuntu-latest
    outputs:
      rotation-needed: ${{ steps.check-rotation.outputs.needed }}
      secrets-to-rotate: ${{ steps.check-rotation.outputs.secrets }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install rotation tools
        run: |
          npm install -g @hashicorp/vault-cli
          pip install hvac boto3 azure-identity azure-keyvault-secrets

      - name: Check rotation requirements
        id: check-rotation
        run: |
          python3 scripts/check-secret-rotation.py \
            --output-json rotation-plan.json \
            --rotation-type ${{ github.event.inputs.rotation_type || 'standard' }} \
            --force ${{ github.event.inputs.force_rotation || 'false' }}
          
          echo "needed=$(jq -r '.rotation_needed' rotation-plan.json)" >> $GITHUB_OUTPUT
          echo "secrets=$(jq -c '.secrets_to_rotate' rotation-plan.json)" >> $GITHUB_OUTPUT

      - name: Upload rotation plan
        uses: actions/upload-artifact@v4
        with:
          name: rotation-plan
          path: rotation-plan.json

  # Application secrets rotation
  rotate-application-secrets:
    name: Rotate Application Secrets
    runs-on: ubuntu-latest
    needs: pre-rotation-checks
    if: needs.pre-rotation-checks.outputs.rotation-needed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate and deploy new secrets
        run: |
          python3 scripts/rotate-app-secrets.py \
            --type jwt,encryption,api-keys \
            --environment production \
            --verify-deployment

  # Cleanup and validation
  post-rotation-validation:
    name: Post-Rotation Validation
    runs-on: ubuntu-latest
    needs: rotate-application-secrets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate rotation success
        run: |
          python3 scripts/validate-rotation.py \
            --check-connectivity \
            --verify-new-secrets