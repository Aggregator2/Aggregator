  #     - SPAN_STORAGE_TYPE=elasticsearch
  #     - ES_SERVER_URLS=http://elasticsearch-jaeger:9200
  #     - ES_NUM_SHARDS=1
  #     - ES_NUM_REPLICAS=0
  #     - COLLECTOR_OTLP_ENABLED=true
  #   ports:
  #     - "14269:14269"  # Admin HTTP
  #     - "14268:14268"  # HTTP collector
  #     - "14250:14250"  # gRPC collector
  #     - "4317:4317"    # OTLP gRPC
  #     - "4318:4318"    # OTLP HTTP
  #   networks:
  #     - tracing
  #   depends_on:
  #     - elasticsearch-jaeger

  # # Jaeger Query Service
  # jaeger-query:
  #   image: jaegertracing/jaeger-query:1.50
  #   container_name: jaeger-query
  #   environment:
  #     - SPAN_STORAGE_TYPE=elasticsearch
  #     - ES_SERVER_URLS=http://elasticsearch-jaeger:9200
  #     - ES_NUM_SHARDS=1
  #     - ES_NUM_REPLICAS=0
  #   ports:
  #     - "16686:16686"  # Jaeger UI
  #     - "16687:16687"  # Admin HTTP
  #   networks:
  #     - tracing
  #   depends_on:
  #     - elasticsearch-jaeger

  # # Jaeger Agent
  # jaeger-agent:
  #   image: jaegertracing/jaeger-agent:1.50
  #   container_name: jaeger-agent
  #   environment:
  #     - REPORTER_GRPC_HOST_PORT=jaeger-collector:14250
  #   ports:
  #     - "6831:6831/udp"  # UDP
  #     - "6832:6832/udp"  # UDP
  #     - "5778:5778"     # HTTP
  #     - "14271:14271"   # Admin HTTP
  #   networks:
  #     - tracing
  #   depends_on:
  #     - jaeger-collector

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    volumes:
      - ./config/otel-collector/otel-collector.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4319:4317"    # OTLP gRPC receiver
      - "4320:4318"    # OTLP HTTP receiver
      - "8889:8889"    # Prometheus metrics
      - "13133:13133"  # Health check
    command: ["--config=/etc/otel-collector-config.yml"]
    networks:
      - tracing
    depends_on:
      - jaeger-all-in-one

  # Prometheus for metrics
  prometheus-jaeger:
    image: prom/prometheus:v2.45.0
    container_name: prometheus-jaeger
    volumes:
      - ./config/prometheus/prometheus-jaeger.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-jaeger-data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - tracing
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana for visualization
  grafana-jaeger:
    image: grafana/grafana:10.1.0
    container_name: grafana-jaeger
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./config/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-jaeger-data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - tracing
    depends_on:
      - prometheus-jaeger
      - jaeger-all-in-one

networks:
  tracing:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  jaeger-data:
    driver: local
  # elasticsearch-jaeger-data:
  #   driver: local
  prometheus-jaeger-data:
    driver: local
  grafana-jaeger-data:
    driver: local