# SwappiQ Monitoring Infrastructure - Reverse Proxy Configuration
# Author: SwappiQ Protocol
# Description: Secure reverse proxy for monitoring services with TLS termination

upstream grafana {
    server grafana:3000;
    keepalive 32;
}

upstream prometheus {
    server prometheus:9090;
    keepalive 16;
}

upstream kibana {
    server kibana:5601;
    keepalive 16;
}

upstream jaeger {
    server jaeger:16686;
    keepalive 16;
}

upstream alertmanager {
    server alertmanager:9093;
    keepalive 8;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=grafana_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_calls:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=50r/m;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

server {
    listen 80;
    server_name monitoring.swappiq.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name monitoring.swappiq.com;
    
    # SSL Configuration
    ssl_certificate /etc/nginx/certs/monitoring.swappiq.com.crt;
    ssl_certificate_key /etc/nginx/certs/monitoring.swappiq.com.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' wss: ws:;" always;
    
    # Connection limits
    limit_conn conn_limit_per_ip 20;
    
    # Common rate limiting
    limit_req zone=general burst=20 nodelay;
    
    # Hide server information
    server_tokens off;
    
    # Common security settings
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 3m;
    large_client_header_buffers 4 256k;
    
    # Grafana - Main monitoring interface
    location / {\n        # Authentication required for all Grafana access\n        auth_basic \"SwappiQ Monitoring\";\n        auth_basic_user_file /etc/nginx/htpasswd;\n        \n        # Additional rate limiting for login endpoints\n        location /login {\n            limit_req zone=grafana_login burst=3 nodelay;\n            proxy_pass http://grafana;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n        }\n        \n        # WebSocket support for live updates\n        location /api/live/ {\n            proxy_pass http://grafana;\n            proxy_http_version 1.1;\n            proxy_set_header Upgrade $http_upgrade;\n            proxy_set_header Connection \"upgrade\";\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n            proxy_cache_bypass $http_upgrade;\n            proxy_read_timeout 86400;\n        }\n        \n        proxy_pass http://grafana;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        \n        # Timeout settings\n        proxy_connect_timeout 30s;\n        proxy_send_timeout 30s;\n        proxy_read_timeout 30s;\n        \n        # Buffer settings\n        proxy_buffering on;\n        proxy_buffer_size 4k;\n        proxy_buffers 8 4k;\n        proxy_busy_buffers_size 8k;\n    }\n    \n    # Prometheus - Internal metrics access\n    location /prometheus/ {\n        # Restrict to internal networks only\n        allow 172.20.0.0/16;\n        deny all;\n        \n        # Admin authentication required\n        auth_basic \"Prometheus Admin\";\n        auth_basic_user_file /etc/nginx/htpasswd_admin;\n        \n        limit_req zone=api_calls burst=50 nodelay;\n        \n        rewrite ^/prometheus/(.*)$ /$1 break;\n        proxy_pass http://prometheus;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n    \n    # Kibana - Log analysis (admin only)\n    location /kibana/ {\n        # Admin authentication required\n        auth_basic \"Kibana Admin\";\n        auth_basic_user_file /etc/nginx/htpasswd_admin;\n        \n        limit_req zone=api_calls burst=30 nodelay;\n        \n        rewrite ^/kibana/(.*)$ /$1 break;\n        proxy_pass http://kibana;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        \n        # Increase timeouts for large log queries\n        proxy_connect_timeout 60s;\n        proxy_send_timeout 60s;\n        proxy_read_timeout 60s;\n    }\n    \n    # Jaeger - Distributed tracing (admin only)\n    location /jaeger/ {\n        # Admin authentication required\n        auth_basic \"Jaeger Admin\";\n        auth_basic_user_file /etc/nginx/htpasswd_admin;\n        \n        limit_req zone=api_calls burst=20 nodelay;\n        \n        rewrite ^/jaeger/(.*)$ /$1 break;\n        proxy_pass http://jaeger;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n    \n    # Alertmanager - Alert management (admin only)\n    location /alertmanager/ {\n        # Admin authentication required\n        auth_basic \"Alertmanager Admin\";\n        auth_basic_user_file /etc/nginx/htpasswd_admin;\n        \n        limit_req zone=api_calls burst=10 nodelay;\n        \n        rewrite ^/alertmanager/(.*)$ /$1 break;\n        proxy_pass http://alertmanager;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n    \n    # Health check endpoint (no auth required)\n    location /health {\n        access_log off;\n        return 200 \"healthy\\n\";\n        add_header Content-Type text/plain;\n    }\n    \n    # Block access to sensitive paths\n    location ~ /\\. {\n        deny all;\n        access_log off;\n        log_not_found off;\n    }\n    \n    location ~ /\\.well-known {\n        allow all;\n    }\n    \n    # Custom error pages\n    error_page 401 /errors/401.html;\n    error_page 403 /errors/403.html;\n    error_page 404 /errors/404.html;\n    error_page 500 502 503 504 /errors/50x.html;\n    \n    location /errors/ {\n        alias /etc/nginx/errors/;\n        internal;\n    }\n    \n    # Access and error logs\n    access_log /var/log/nginx/monitoring.access.log combined;\n    error_log /var/log/nginx/monitoring.error.log warn;\n}