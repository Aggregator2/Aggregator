# SwappiQ Protocol Alert Manager Configuration\n# Author: SwappiQ Protocol\n# Description: Production-ready alerting with PagerDuty, Slack, and email integration\n\nglobal:\n  # SMTP configuration for email alerts\n  smtp_smarthost: 'smtp.company.com:587'\n  smtp_from: 'alerts@swappiq.com'\n  smtp_auth_username: '${SMTP_USERNAME}'\n  smtp_auth_password_file: '/etc/alertmanager/secrets/smtp_password'\n  smtp_require_tls: true\n  \n  # PagerDuty integration\n  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'\n  \n  # Slack webhook URL (loaded from file for security)\n  slack_api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'\n  \n  # Global notification timeout\n  resolve_timeout: 5m\n\n# Routing configuration\nroute:\n  # Group alerts by cluster, service, and alertname\n  group_by: ['cluster', 'service', 'alertname']\n  \n  # Wait time before sending initial notification\n  group_wait: 10s\n  \n  # Wait time before sending notification for new alerts in existing group\n  group_interval: 5m\n  \n  # Wait time before re-sending notifications for unresolved alerts\n  repeat_interval: 4h\n  \n  # Default receiver for all alerts\n  receiver: 'default-notifications'\n  \n  # Route configuration for different alert types\n  routes:\n    # Critical alerts - immediate PagerDuty notification\n    - match:\n        severity: critical\n      receiver: 'critical-alerts'\n      group_wait: 0s\n      group_interval: 1m\n      repeat_interval: 30m\n      continue: true\n    \n    # Trading engine alerts - specialized handling\n    - match:\n        service: trading-engine\n      receiver: 'trading-alerts'\n      group_interval: 2m\n      repeat_interval: 1h\n      continue: true\n    \n    # Security alerts - immediate escalation\n    - match:\n        category: security\n      receiver: 'security-alerts'\n      group_wait: 0s\n      group_interval: 1m\n      repeat_interval: 15m\n      continue: true\n    \n    # Settlement alerts - financial impact\n    - match:\n        service: settlement\n      receiver: 'settlement-alerts'\n      group_interval: 2m\n      repeat_interval: 30m\n      continue: true\n    \n    # Infrastructure alerts - platform stability\n    - match:\n        category: infrastructure\n      receiver: 'infrastructure-alerts'\n      group_interval: 5m\n      repeat_interval: 2h\n    \n    # Business alerts - KPI monitoring\n    - match:\n        category: business\n      receiver: 'business-alerts'\n      group_interval: 10m\n      repeat_interval: 6h\n\n# Inhibition rules - suppress alerts based on other active alerts\ninhibit_rules:\n  # Suppress instance-level alerts when entire service is down\n  - source_match:\n      alertname: 'ServiceDown'\n    target_match:\n      service: '{{ $labels.service }}'\n    equal: ['service']\n  \n  # Suppress warning alerts when critical alerts are firing\n  - source_match:\n      severity: 'critical'\n    target_match:\n      severity: 'warning'\n    equal: ['service', 'instance']\n  \n  # Suppress database connection alerts when database is down\n  - source_match:\n      alertname: 'DatabaseDown'\n    target_match:\n      alertname: 'DatabaseConnectionHigh'\n    equal: ['instance']\n\n# Notification receivers\nreceivers:\n  # Default notifications - Slack + Email\n  - name: 'default-notifications'\n    slack_configs:\n      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'\n        channel: '#alerts'\n        title: 'SwappiQ Alert: {{ .GroupLabels.alertname }}'\n        text: |\n          {{ range .Alerts }}\n          *Alert:* {{ .Annotations.summary }}\n          *Severity:* {{ .Labels.severity }}\n          *Service:* {{ .Labels.service }}\n          *Instance:* {{ .Labels.instance }}\n          *Description:* {{ .Annotations.description }}\n          {{ if .Labels.runbook_url }}*Runbook:* {{ .Labels.runbook_url }}{{ end }}\n          {{ end }}\n        color: '{{ if eq .Status \"firing\" }}danger{{ else }}good{{ end }}'\n        send_resolved: true\n    \n    email_configs:\n      - to: 'alerts@swappiq.com'\n        subject: '[SwappiQ] {{ .Status | toUpper }}: {{ .GroupLabels.alertname }}'\n        body: |\n          {{ range .Alerts }}\n          Alert: {{ .Annotations.summary }}\n          Severity: {{ .Labels.severity }}\n          Service: {{ .Labels.service }}\n          Instance: {{ .Labels.instance }}\n          Description: {{ .Annotations.description }}\n          \n          {{ if .Labels.runbook_url }}Runbook: {{ .Labels.runbook_url }}{{ end }}\n          \n          Started: {{ .StartsAt.Format \"2006-01-02 15:04:05 UTC\" }}\n          {{ if .EndsAt }}Ended: {{ .EndsAt.Format \"2006-01-02 15:04:05 UTC\" }}{{ end }}\n          {{ end }}\n  \n  # Critical alerts - PagerDuty + Slack + Email\n  - name: 'critical-alerts'\n    pagerduty_configs:\n      - service_key_file: '/etc/alertmanager/secrets/pagerduty_service_key'\n        severity: 'critical'\n        description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'\n        details:\n          service: '{{ .GroupLabels.service }}'\n          instance: '{{ .GroupLabels.instance }}'\n          severity: '{{ .GroupLabels.severity }}'\n          description: '{{ .CommonAnnotations.description }}'\n        links:\n          - href: '{{ .CommonLabels.dashboard_url }}'\n            text: 'Dashboard'\n          - href: '{{ .CommonLabels.runbook_url }}'\n            text: 'Runbook'\n    \n    slack_configs:\n      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'\n        channel: '#critical-alerts'\n        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'\n        text: |\n          {{ range .Alerts }}\n          *CRITICAL ALERT*\n          *Summary:* {{ .Annotations.summary }}\n          *Service:* {{ .Labels.service }}\n          *Instance:* {{ .Labels.instance }}\n          *Description:* {{ .Annotations.description }}\n          \n          *Action Required:* Immediate investigation needed\n          {{ if .Labels.runbook_url }}*Runbook:* {{ .Labels.runbook_url }}{{ end }}\n          {{ end }}\n        color: 'danger'\n        send_resolved: true\n  \n  # Trading engine alerts\n  - name: 'trading-alerts'\n    slack_configs:\n      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'\n        channel: '#trading-alerts'\n        title: '📈 Trading Alert: {{ .GroupLabels.alertname }}'\n        text: |\n          {{ range .Alerts }}\n          *Trading System Alert*\n          *Summary:* {{ .Annotations.summary }}\n          *Severity:* {{ .Labels.severity }}\n          *Impact:* {{ .Annotations.impact }}\n          *Description:* {{ .Annotations.description }}\n          {{ if .Labels.runbook_url }}*Runbook:* {{ .Labels.runbook_url }}{{ end }}\n          {{ end }}\n        color: '{{ if eq .Status \"firing\" }}warning{{ else }}good{{ end }}'\n        send_resolved: true\n    \n    email_configs:\n      - to: 'trading-team@swappiq.com'\n        subject: '[Trading] {{ .Status | toUpper }}: {{ .GroupLabels.alertname }}'\n  \n  # Security alerts\n  - name: 'security-alerts'\n    pagerduty_configs:\n      - service_key_file: '/etc/alertmanager/secrets/pagerduty_security_key'\n        severity: 'critical'\n        description: 'SECURITY ALERT: {{ .GroupLabels.alertname }}'\n    \n    slack_configs:\n      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'\n        channel: '#security-alerts'\n        title: '🔒 SECURITY ALERT: {{ .GroupLabels.alertname }}'\n        text: |\n          {{ range .Alerts }}\n          *SECURITY ALERT - IMMEDIATE ATTENTION REQUIRED*\n          *Summary:* {{ .Annotations.summary }}\n          *Threat Level:* {{ .Labels.threat_level }}\n          *Affected Service:* {{ .Labels.service }}\n          *Source:* {{ .Labels.source_ip }}\n          *Description:* {{ .Annotations.description }}\n          \n          *Response Required:* {{ .Annotations.response_action }}\n          {{ if .Labels.runbook_url }}*Incident Response:* {{ .Labels.runbook_url }}{{ end }}\n          {{ end }}\n        color: 'danger'\n        send_resolved: true\n    \n    email_configs:\n      - to: 'security-team@swappiq.com,ciso@swappiq.com'\n        subject: '[SECURITY] {{ .Status | toUpper }}: {{ .GroupLabels.alertname }}'\n  \n  # Settlement alerts\n  - name: 'settlement-alerts'\n    slack_configs:\n      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'\n        channel: '#settlement-alerts'\n        title: '💰 Settlement Alert: {{ .GroupLabels.alertname }}'\n        text: |\n          {{ range .Alerts }}\n          *Settlement System Alert*\n          *Summary:* {{ .Annotations.summary }}\n          *Financial Impact:* {{ .Labels.financial_impact }}\n          *Settlement Status:* {{ .Labels.settlement_status }}\n          *Description:* {{ .Annotations.description }}\n          {{ if .Labels.runbook_url }}*Runbook:* {{ .Labels.runbook_url }}{{ end }}\n          {{ end }}\n        color: '{{ if eq .Status \"firing\" }}warning{{ else }}good{{ end }}'\n        send_resolved: true\n  \n  # Infrastructure alerts\n  - name: 'infrastructure-alerts'\n    slack_configs:\n      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'\n        channel: '#infrastructure-alerts'\n        title: '🔧 Infrastructure Alert: {{ .GroupLabels.alertname }}'\n        text: |\n          {{ range .Alerts }}\n          *Infrastructure Alert*\n          *Summary:* {{ .Annotations.summary }}\n          *Component:* {{ .Labels.component }}\n          *Severity:* {{ .Labels.severity }}\n          *Description:* {{ .Annotations.description }}\n          {{ if .Labels.runbook_url }}*Runbook:* {{ .Labels.runbook_url }}{{ end }}\n          {{ end }}\n        color: '{{ if eq .Status \"firing\" }}warning{{ else }}good{{ end }}'\n        send_resolved: true\n  \n  # Business alerts\n  - name: 'business-alerts'\n    slack_configs:\n      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'\n        channel: '#business-metrics'\n        title: '📊 Business Alert: {{ .GroupLabels.alertname }}'\n        text: |\n          {{ range .Alerts }}\n          *Business Metrics Alert*\n          *Summary:* {{ .Annotations.summary }}\n          *KPI:* {{ .Labels.kpi }}\n          *Impact:* {{ .Labels.business_impact }}\n          *Current Value:* {{ .Labels.current_value }}\n          *Threshold:* {{ .Labels.threshold }}\n          *Description:* {{ .Annotations.description }}\n          {{ end }}\n        color: '{{ if eq .Status \"firing\" }}warning{{ else }}good{{ end }}'\n        send_resolved: true\n    \n    email_configs:\n      - to: 'business-team@swappiq.com'\n        subject: '[Business] {{ .Status | toUpper }}: {{ .GroupLabels.alertname }}'\n\n# Templates for custom notifications\ntemplates:\n  - '/etc/alertmanager/templates/*.tmpl'"