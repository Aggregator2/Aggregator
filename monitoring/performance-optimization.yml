# SwappiQ Monitoring Performance Optimization Configuration\n# Author: SwappiQ Protocol\n# Description: Gas efficiency and performance optimization settings\n\n# Prometheus Optimization Settings\nprometheus:\n  # Storage optimization for gas efficiency\n  storage:\n    retention:\n      time: \"15d\"  # Reduced from default 30d to save storage costs\n      size: \"50GB\"  # Cap storage size\n    compression:\n      wal: true     # Enable WAL compression\n      blocks: true  # Enable block compression\n  \n  # Query optimization\n  query:\n    timeout: \"30s\"           # Prevent long-running queries\n    max_concurrent: 20       # Limit concurrent queries\n    max_samples: 50000000    # Limit sample processing\n    lookback_delta: \"5m\"     # Optimize lookback window\n  \n  # Scraping optimization\n  scraping:\n    default_interval: \"15s\"  # Balance between accuracy and efficiency\n    timeout: \"10s\"           # Prevent hanging scrapes\n    \n  # Rule evaluation optimization\n  evaluation:\n    interval: \"15s\"          # Align with scrape interval\n    batch_size: 1000         # Process rules in batches\n\n# Grafana Performance Settings\ngrafana:\n  # Database optimization\n  database:\n    connection_pool:\n      max_open: 100          # Limit database connections\n      max_idle: 10           # Maintain idle connections\n      max_lifetime: \"4h\"     # Connection lifetime\n    \n    query_timeout: \"30s\"     # Prevent slow queries\n  \n  # Caching optimization\n  caching:\n    redis:\n      pool_size: 100         # Redis connection pool\n      ttl: \"5m\"              # Cache TTL for dashboards\n      memory_limit: \"512MB\"  # Limit cache memory\n  \n  # Dashboard optimization\n  dashboards:\n    refresh_intervals:\n      min: \"5s\"              # Minimum refresh interval\n      default: \"30s\"         # Default for most dashboards\n    \n    query_optimization:\n      max_data_points: 1000  # Limit data points per series\n      query_timeout: \"30s\"   # Query timeout\n      concurrent_limit: 10   # Concurrent query limit\n\n# Elasticsearch Optimization\nelasticsearch:\n  # Index optimization for cost efficiency\n  indices:\n    lifecycle:\n      hot_phase: \"1d\"        # Keep recent data in hot tier\n      warm_phase: \"7d\"       # Move to warm tier after 7 days\n      cold_phase: \"30d\"      # Move to cold tier after 30 days\n      delete_phase: \"90d\"    # Delete after 90 days\n    \n    sharding:\n      primary_shards: 1      # Optimize shard count for small indices\n      replica_shards: 1      # Single replica for HA\n    \n    compression:\n      level: \"best_compression\"  # Maximize compression\n      codec: \"best_compression\"\n  \n  # Query optimization\n  search:\n    timeout: \"30s\"          # Search timeout\n    max_buckets: 10000      # Limit aggregation buckets\n    scroll_timeout: \"5m\"    # Scroll context timeout\n  \n  # Memory optimization\n  memory:\n    heap_size: \"2g\"         # JVM heap size\n    field_data_cache: \"20%\" # Field data cache limit\n    query_cache: \"10%\"      # Query cache limit\n\n# Redis Optimization\nredis:\n  # Memory optimization\n  memory:\n    max_memory: \"1gb\"       # Memory limit\n    policy: \"allkeys-lru\"   # Eviction policy\n    samples: 5              # LRU sampling\n  \n  # Performance settings\n  performance:\n    timeout: \"5s\"           # Connection timeout\n    tcp_keepalive: 60       # TCP keepalive\n    tcp_nodelay: true       # Disable Nagle algorithm\n  \n  # Persistence optimization\n  persistence:\n    save_interval: \"300 10\" # Save every 5 minutes if 10+ changes\n    aof_enabled: false      # Disable AOF for performance\n\n# PostgreSQL Optimization\npostgresql:\n  # Connection optimization\n  connections:\n    max_connections: 200    # Maximum connections\n    shared_buffers: \"256MB\" # Shared buffer cache\n    effective_cache_size: \"1GB\" # Available cache\n  \n  # Query optimization\n  query:\n    work_mem: \"4MB\"         # Working memory per query\n    maintenance_work_mem: \"64MB\" # Maintenance operations\n    statement_timeout: \"30s\" # Query timeout\n  \n  # Checkpoint optimization\n  checkpoints:\n    completion_target: 0.9  # Spread checkpoint I/O\n    timeout: \"15min\"        # Checkpoint frequency\n    segments: 16            # WAL segments\n\n# Network Optimization\nnetwork:\n  # Load balancing\n  load_balancer:\n    algorithm: \"least_conn\" # Distribute based on connections\n    health_check:\n      interval: \"10s\"       # Health check frequency\n      timeout: \"5s\"         # Health check timeout\n      retries: 3            # Retry attempts\n  \n  # Connection pooling\n  connection_pool:\n    size: 100               # Pool size per service\n    timeout: \"30s\"          # Connection timeout\n    keepalive: \"60s\"        # Keep connections alive\n  \n  # Rate limiting\n  rate_limiting:\n    requests_per_second: 1000  # Global rate limit\n    burst_size: 100            # Burst allowance\n    window_size: \"1m\"          # Rate limiting window\n\n# Container Resource Optimization\ncontainers:\n  # Resource limits to prevent gas wastage\n  prometheus:\n    cpu_limit: \"2\"          # CPU cores\n    memory_limit: \"4GB\"     # Memory limit\n    cpu_request: \"500m\"     # CPU request\n    memory_request: \"2GB\"   # Memory request\n  \n  grafana:\n    cpu_limit: \"1\"          # CPU cores\n    memory_limit: \"2GB\"     # Memory limit\n    cpu_request: \"250m\"     # CPU request\n    memory_request: \"1GB\"   # Memory request\n  \n  elasticsearch:\n    cpu_limit: \"2\"          # CPU cores\n    memory_limit: \"4GB\"     # Memory limit\n    cpu_request: \"1\"        # CPU request\n    memory_request: \"2GB\"   # Memory request\n  \n  # JVM optimization for Java services\n  jvm_opts:\n    elasticsearch: \"-Xms2g -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200\"\n    logstash: \"-Xms1g -Xmx1g -XX:+UseG1GC\"\n\n# Monitoring Optimization\nmonitoring:\n  # Metric collection efficiency\n  metrics:\n    # High-frequency metrics (real-time trading)\n    high_frequency:\n      interval: \"1s\"          # Trade execution metrics\n      retention: \"1h\"         # Short retention\n      compression: \"high\"     # Aggressive compression\n    \n    # Medium-frequency metrics (system health)\n    medium_frequency:\n      interval: \"15s\"         # System metrics\n      retention: \"7d\"         # Week retention\n      compression: \"medium\"   # Balanced compression\n    \n    # Low-frequency metrics (business KPIs)\n    low_frequency:\n      interval: \"1m\"          # Business metrics\n      retention: \"30d\"        # Month retention\n      compression: \"low\"      # Light compression\n  \n  # Alert optimization\n  alerts:\n    batch_size: 100           # Batch alert processing\n    evaluation_interval: \"15s\" # Alert evaluation frequency\n    notification_queue: 1000  # Queue size for notifications\n    \n    # Alert suppression to reduce noise\n    suppression:\n      duplicate_timeout: \"5m\" # Suppress duplicate alerts\n      grouping_timeout: \"30s\" # Group related alerts\n      recovery_timeout: \"2m\"  # Wait before recovery alerts\n\n# Gas Efficiency Strategies\ngas_optimization:\n  # Smart contract interaction optimization\n  blockchain:\n    # Gas price monitoring and optimization\n    gas_price:\n      update_interval: \"30s\"   # Monitor gas prices\n      price_threshold: \"50\"    # Gwei threshold for alerts\n      network_switching: true  # Auto-switch to cheaper networks\n    \n    # Transaction batching\n    batching:\n      enabled: true           # Enable transaction batching\n      batch_size: 100         # Transactions per batch\n      timeout: \"5m\"           # Batch timeout\n    \n    # Settlement optimization\n    settlement:\n      min_value: \"$100\"       # Minimum settlement value\n      delay_threshold: \"10m\"  # Maximum settlement delay\n      gas_limit: 500000       # Gas limit per settlement\n  \n  # Infrastructure cost optimization\n  infrastructure:\n    # Auto-scaling based on trading volume\n    auto_scaling:\n      enabled: true           # Enable auto-scaling\n      min_instances: 2        # Minimum instances\n      max_instances: 10       # Maximum instances\n      scale_up_threshold: 80  # CPU threshold to scale up\n      scale_down_threshold: 30 # CPU threshold to scale down\n    \n    # Resource scheduling\n    scheduling:\n      priority_queues: true   # Prioritize critical operations\n      resource_sharing: true  # Share resources between services\n      idle_shutdown: true     # Shutdown idle instances\n\n# Performance Monitoring\nperformance_monitoring:\n  # SLA targets\n  sla_targets:\n    api_response_time: \"100ms\"     # 95th percentile\n    order_processing: \"50ms\"       # Order matching latency\n    settlement_time: \"30s\"         # Settlement completion\n    uptime: \"99.9%\"               # Service availability\n  \n  # Performance metrics\n  metrics:\n    latency_percentiles: [50, 90, 95, 99, 99.9]  # Track latency distribution\n    throughput_metrics: true       # Track requests per second\n    error_rate_metrics: true       # Track error rates\n    resource_utilization: true     # Track CPU/memory usage\n  \n  # Alerting thresholds\n  alerts:\n    response_time_threshold: \"200ms\"  # Alert on slow responses\n    error_rate_threshold: \"1%\"        # Alert on high error rates\n    throughput_threshold: \"1000\"      # Alert on low throughput\n    resource_threshold: \"80%\"         # Alert on high resource usage\n\n# Cost Optimization\ncost_optimization:\n  # Data retention policies\n  retention:\n    metrics: \"15d\"          # Prometheus metrics\n    logs: \"30d\"             # Application logs\n    traces: \"7d\"            # Distributed traces\n    business_data: \"1y\"     # Business analytics\n  \n  # Storage tiering\n  storage_tiers:\n    hot: \"1d\"               # SSD storage for recent data\n    warm: \"7d\"              # Standard storage\n    cold: \"30d\"             # Archival storage\n    glacier: \"1y\"           # Long-term archival\n  \n  # Compression strategies\n  compression:\n    metrics: \"high\"         # Aggressive metric compression\n    logs: \"medium\"          # Balanced log compression\n    traces: \"high\"          # Aggressive trace compression\n  \n  # Resource optimization\n  resources:\n    cpu_optimization: true  # Enable CPU optimization\n    memory_optimization: true # Enable memory optimization\n    network_optimization: true # Enable network optimization\n    storage_optimization: true # Enable storage optimization"