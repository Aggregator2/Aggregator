# SLA Monitoring Configuration for SwappiQ Protocol
# Author: SwappiQ Protocol
# Description: Service Level Agreement monitoring and reporting

sla_definitions:
  # API Service Level Agreements
  api_availability:
    name: "API Service Availability"
    description: "API endpoints must be available 99.9% of the time"
    target: 99.9
    measurement_window: "30d"
    metric_query: "avg_over_time(up{job='swappiq-api'}[30d]) * 100"
    alert_threshold: 99.5
    notification_channels: ["email", "slack", "pagerduty"]
    
  api_response_time:
    name: "API Response Time"
    description: "95th percentile response time must be under 500ms"
    target: 500
    measurement_window: "24h"
    metric_query: "histogram_quantile(0.95, sum(rate(swappiq_http_request_duration_seconds_bucket{job='swappiq-api'}[5m])) by (le)) * 1000"
    alert_threshold: 750
    notification_channels: ["email", "slack"]
    
  api_error_rate:
    name: "API Error Rate"
    description: "Error rate must be below 0.1%"
    target: 0.1
    measurement_window: "24h"
    metric_query: "sum(rate(swappiq_http_requests_total{job='swappiq-api',status=~'5..'}[24h])) / sum(rate(swappiq_http_requests_total{job='swappiq-api'}[24h])) * 100"
    alert_threshold: 0.5
    notification_channels: ["email", "slack", "pagerduty"]

  # Trading Engine SLAs
  trading_availability:
    name: "Trading Engine Availability"
    description: "Trading engine must be available 99.99% of the time"
    target: 99.99
    measurement_window: "30d"
    metric_query: "avg_over_time(up{job='matching-engine'}[30d]) * 100"
    alert_threshold: 99.95
    notification_channels: ["email", "slack", "pagerduty"]
    
  order_processing_time:
    name: "Order Processing Time"
    description: "95th percentile order processing time must be under 100ms"
    target: 100
    measurement_window: "1h"
    metric_query: "histogram_quantile(0.95, sum(rate(swappiq_order_processing_duration_seconds_bucket[5m])) by (le)) * 1000"
    alert_threshold: 200
    notification_channels: ["email", "slack", "pagerduty"]
    
  trade_execution_success:
    name: "Trade Execution Success Rate"
    description: "Trade execution success rate must be above 99.5%"
    target: 99.5
    measurement_window: "24h"
    metric_query: "sum(rate(swappiq_trades_total{status='completed'}[24h])) / sum(rate(swappiq_trades_total[24h])) * 100"
    alert_threshold: 99.0
    notification_channels: ["email", "slack", "pagerduty"]

  # Settlement SLAs
  settlement_availability:
    name: "Settlement Service Availability"
    description: "Settlement service must be available 99.95% of the time"
    target: 99.95
    measurement_window: "30d"
    metric_query: "avg_over_time(up{job='settlement-service'}[30d]) * 100"
    alert_threshold: 99.9
    notification_channels: ["email", "slack", "pagerduty"]
    
  settlement_processing_time:
    name: "Settlement Processing Time"
    description: "95th percentile settlement time must be under 60 seconds"
    target: 60
    measurement_window: "4h"
    metric_query: "histogram_quantile(0.95, sum(rate(swappiq_settlement_duration_seconds_bucket[5m])) by (le))"
    alert_threshold: 120
    notification_channels: ["email", "slack"]
    
  settlement_success_rate:
    name: "Settlement Success Rate"
    description: "Settlement success rate must be above 99.8%"
    target: 99.8
    measurement_window: "24h"
    metric_query: "sum(rate(swappiq_settlements_total{status='success'}[24h])) / sum(rate(swappiq_settlements_total[24h])) * 100"
    alert_threshold: 99.5
    notification_channels: ["email", "slack", "pagerduty"]

  # Database SLAs
  database_availability:
    name: "Database Availability"
    description: "Primary database must be available 99.95% of the time"
    target: 99.95
    measurement_window: "30d"
    metric_query: "avg_over_time(pg_up[30d]) * 100"
    alert_threshold: 99.9
    notification_channels: ["email", "slack", "pagerduty"]
    
  database_query_performance:
    name: "Database Query Performance"
    description: "95th percentile query time must be under 500ms"
    target: 500
    measurement_window: "1h"
    metric_query: "histogram_quantile(0.95, sum(rate(pg_stat_statements_total_time_bucket[5m])) by (le))"
    alert_threshold: 1000
    notification_channels: ["email", "slack"]

  # WebSocket SLAs
  websocket_availability:
    name: "WebSocket Service Availability"
    description: "WebSocket service must be available 99.9% of the time"
    target: 99.9
    measurement_window: "30d"
    metric_query: "avg_over_time(up{job='websocket-service'}[30d]) * 100"
    alert_threshold: 99.5
    notification_channels: ["email", "slack"]
    
  websocket_message_latency:
    name: "WebSocket Message Latency"
    description: "95th percentile message delivery time must be under 50ms"
    target: 50
    measurement_window: "1h"
    metric_query: "histogram_quantile(0.95, sum(rate(swappiq_websocket_message_duration_seconds_bucket[5m])) by (le)) * 1000"
    alert_threshold: 100
    notification_channels: ["email", "slack"]

  # Business SLAs
  platform_uptime:
    name: "Overall Platform Uptime"
    description: "Combined platform uptime must be above 99.9%"
    target: 99.9
    measurement_window: "30d"
    metric_query: "min(avg_over_time(up{job=~'swappiq-.*'}[30d])) * 100"
    alert_threshold: 99.5
    notification_channels: ["email", "slack", "pagerduty"]

# SLA Reporting Configuration
reporting:
  # Report generation schedule
  schedule:
    daily_report: "0 8 * * *"  # 8 AM every day
    weekly_report: "0 9 * * 1"  # 9 AM every Monday
    monthly_report: "0 10 1 * *"  # 10 AM first day of month
    
  # Report recipients
  recipients:
    daily:
      - "devops@swappiq.com"
      - "cto@swappiq.com"
    weekly:
      - "management@swappiq.com"
      - "devops@swappiq.com"
      - "business@swappiq.com"
    monthly:
      - "board@swappiq.com"
      - "ceo@swappiq.com"
      - "cto@swappiq.com"
      - "stakeholders@swappiq.com"
      
  # Report formats
  formats:
    - "html"
    - "pdf"
    - "json"
    
  # Dashboard links
  dashboards:
    sla_overview: "https://grafana.swappiq.com/d/sla-overview"
    detailed_metrics: "https://grafana.swappiq.com/d/detailed-sla"
    historical_trends: "https://grafana.swappiq.com/d/sla-trends"

# Error Budget Configuration
error_budgets:
  calculation_method: "availability"  # availability, error_rate, or latency
  budget_period: "30d"
  
  # Budget allocation per service
  services:
    api:
      availability_budget: 0.1  # 0.1% downtime allowed (99.9% SLA)
      error_rate_budget: 0.1    # 0.1% error rate allowed
      latency_budget: 5         # 5% of requests can exceed latency target
      
    trading-engine:
      availability_budget: 0.01  # 0.01% downtime allowed (99.99% SLA)
      error_rate_budget: 0.05    # 0.05% error rate allowed
      latency_budget: 2          # 2% of requests can exceed latency target
      
    settlement:
      availability_budget: 0.05  # 0.05% downtime allowed (99.95% SLA)
      error_rate_budget: 0.2     # 0.2% error rate allowed
      latency_budget: 5          # 5% of requests can exceed latency target
      
    database:
      availability_budget: 0.05  # 0.05% downtime allowed (99.95% SLA)
      error_rate_budget: 0.1     # 0.1% error rate allowed
      latency_budget: 5          # 5% of queries can exceed latency target

# Alerting Integration
alerting:
  prometheus_rules_file: "/etc/prometheus/rules/sla-rules.yml"
  alertmanager_route: "sla-alerts"
  
  # SLA breach notification
  breach_notification:
    immediate: ["pagerduty", "slack"]
    followup: ["email"]
    escalation_delay: "15m"
    
  # Error budget exhaustion alerts
  budget_alerts:
    warning_threshold: 75  # Alert when 75% of budget is consumed
    critical_threshold: 90  # Critical alert when 90% of budget is consumed
    forecast_enabled: true  # Enable budget exhaustion forecasting
    forecast_window: "7d"   # Forecast budget exhaustion over 7 days

# Compliance and Audit
compliance:
  # Regulatory requirements
  financial_regulations:
    data_retention: "7y"  # 7 years data retention
    audit_trail: true
    compliance_reporting: true
    
  # Industry standards
  standards:
    - "SOC 2 Type II"
    - "ISO 27001"
    - "PCI DSS Level 1"
    
  # Audit configuration
  audit:
    enabled: true
    audit_log_retention: "3y"
    automated_compliance_checks: true
    quarterly_reviews: true

# Integration Configuration
integrations:
  prometheus:
    endpoint: "http://prometheus:9090"
    query_timeout: "30s"
    
  grafana:
    endpoint: "https://grafana.swappiq.com"
    api_key_file: "/etc/sla/secrets/grafana_api_key"
    
  alertmanager:
    endpoint: "http://alertmanager:9093"
    
  elasticsearch:
    endpoint: "https://elasticsearch:9200"
    username: "sla_monitor"
    password_file: "/etc/sla/secrets/elasticsearch_password"