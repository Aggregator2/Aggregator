# Logstash configuration for SwappiQ Protocol log processing
# Author: SwappiQ Protocol
# Description: Comprehensive log parsing and enrichment pipeline

input {
  # API service logs
  beats {
    port => 5044
    host => "0.0.0.0"
  }
  
  # Direct TCP logs from applications
  tcp {
    port => 5000
    codec => json_lines
    type => "app-logs"
  }
  
  # WebSocket service logs
  tcp {
    port => 5001
    codec => json_lines
    type => "websocket-logs"
  }
  
  # Trading engine logs
  tcp {
    port => 5002
    codec => json_lines
    type => "trading-logs"
  }
  
  # Settlement service logs
  tcp {
    port => 5003
    codec => json_lines
    type => "settlement-logs"
  }
  
  # Security/audit logs
  tcp {
    port => 5004
    codec => json_lines
    type => "security-logs"
  }
  
  # Kubernetes logs (if deployed on K8s)
  beats {
    port => 5045
    host => "0.0.0.0"
    type => "kubernetes-logs"
  }
}

filter {
  # Common fields for all logs
  mutate {
    add_field => {
      "[@metadata][pipeline]" => "swappiq"
      "[@metadata][environment]" => "${ENVIRONMENT:production}"
      "[@metadata][cluster]" => "${CLUSTER_NAME:swappiq-prod}"
    }
  }
  
  # Parse timestamp if it's a string
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS", "yyyy-MM-dd'T'HH:mm:ss.SSSZ" ]
      target => "@timestamp"
    }
  }
  
  # API service log processing
  if [type] == "app-logs" or [fields][service] == "api" {
    # Parse API request logs
    if [message] =~ /\[REQUEST\]/ {
      grok {
        match => { 
          "message" => "\[REQUEST\] %{WORD:http_method} %{URIPATH:endpoint}(?:%{URIPARAM:query_params})? - %{DATA:request_id} - User: %{DATA:user_id} - IP: %{IP:client_ip} - Duration: %{NUMBER:duration_ms:float}ms - Status: %{NUMBER:status_code:int}" 
        }
        add_tag => ["api_request"]
      }
      
      # Calculate request size if present
      if [content_length] {
        mutate {
          convert => { "content_length" => "integer" }
        }
      }
      
      # Add response time categories
      if [duration_ms] {
        if [duration_ms] < 100 {
          mutate { add_field => { "response_time_category" => "fast" } }
        } else if [duration_ms] < 1000 {
          mutate { add_field => { "response_time_category" => "normal" } }
        } else if [duration_ms] < 5000 {
          mutate { add_field => { "response_time_category" => "slow" } }
        } else {
          mutate { add_field => { "response_time_category" => "very_slow" } }
        }
      }
      
      # Categorize HTTP status codes
      if [status_code] {
        if [status_code] >= 200 and [status_code] < 300 {
          mutate { add_field => { "status_category" => "success" } }
        } else if [status_code] >= 300 and [status_code] < 400 {
          mutate { add_field => { "status_category" => "redirect" } }
        } else if [status_code] >= 400 and [status_code] < 500 {
          mutate { add_field => { "status_category" => "client_error" } }
        } else if [status_code] >= 500 {
          mutate { add_field => { "status_category" => "server_error" } }
        }
      }
    }
    
    # Parse API error logs
    if [level] == "ERROR" or [level] == "error" {
      mutate {
        add_tag => ["error"]
      }
      
      # Extract error patterns
      if [message] =~ /ValidationError/ {
        mutate { add_field => { "error_type" => "validation" } }
      } else if [message] =~ /AuthenticationError|Unauthorized/ {
        mutate { add_field => { "error_type" => "authentication" } }
      } else if [message] =~ /DatabaseError|Connection|timeout/ {
        mutate { add_field => { "error_type" => "database" } }
      } else if [message] =~ /NetworkError|ECONNREFUSED/ {
        mutate { add_field => { "error_type" => "network" } }
      } else {
        mutate { add_field => { "error_type" => "unknown" } }
      }
    }
  }
  
  # Trading engine log processing
  if [type] == "trading-logs" or [fields][service] == "trading" {
    # Parse trade execution logs
    if [message] =~ /\[TRADE\]/ {
      grok {
        match => { 
          "message" => "\[TRADE\] Trade executed - ID: %{DATA:trade_id} - Pair: %{DATA:trading_pair} - Side: %{WORD:side} - Quantity: %{NUMBER:quantity:float} - Price: %{NUMBER:price:float} - Value: %{NUMBER:trade_value:float} - Maker: %{DATA:maker_id} - Taker: %{DATA:taker_id}" 
        }
        add_tag => ["trade_execution"]
      }
      
      # Calculate trade metrics
      if [quantity] and [price] {
        ruby {
          code => "
            event.set('trade_volume_usd', event.get('quantity').to_f * event.get('price').to_f)
          "
        }
      }
    }
    
    # Parse order logs
    if [message] =~ /\[ORDER\]/ {
      grok {
        match => { 
          "message" => "\[ORDER\] Order %{WORD:order_action} - ID: %{DATA:order_id} - User: %{DATA:user_id} - Pair: %{DATA:trading_pair} - Type: %{WORD:order_type} - Side: %{WORD:side} - Quantity: %{NUMBER:quantity:float} - Price: %{NUMBER:price:float}" 
        }
        add_tag => ["order_event"]
      }
    }
    
    # Parse liquidation logs
    if [message] =~ /\[LIQUIDATION\]/ {
      grok {
        match => { 
          "message" => "\[LIQUIDATION\] Position liquidated - User: %{DATA:user_id} - Pair: %{DATA:trading_pair} - Size: %{NUMBER:liquidation_size:float} - Loss: %{NUMBER:liquidation_loss:float}" 
        }
        add_tag => ["liquidation"]
      }
    }
  }
  
  # WebSocket log processing
  if [type] == "websocket-logs" or [fields][service] == "websocket" {
    # Parse connection events
    if [message] =~ /\[WS\]/ {
      grok {
        match => { 
          "message" => "\[WS\] %{WORD:ws_event} - User: %{DATA:user_id} - IP: %{IP:client_ip} - Connections: %{NUMBER:connection_count:int}" 
        }
        add_tag => ["websocket_event"]
      }
    }
    
    # Parse message throughput
    if [message] =~ /\[MSG\]/ {
      grok {
        match => { 
          "message" => "\[MSG\] Messages sent: %{NUMBER:messages_sent:int} - Queue size: %{NUMBER:queue_size:int} - Latency: %{NUMBER:broadcast_latency:float}ms" 
        }
        add_tag => ["websocket_metrics"]
      }
    }
  }
  
  # Settlement service log processing
  if [type] == "settlement-logs" or [fields][service] == "settlement" {
    # Parse settlement events
    if [message] =~ /\[SETTLEMENT\]/ {
      grok {
        match => { 
          "message" => "\[SETTLEMENT\] Settlement %{WORD:settlement_status} - Trade: %{DATA:trade_id} - Hash: %{DATA:tx_hash} - Gas: %{NUMBER:gas_used:int} - Fee: %{NUMBER:gas_fee:float}" 
        }
        add_tag => ["settlement_event"]
      }
    }
    
    # Parse blockchain events
    if [message] =~ /\[BLOCKCHAIN\]/ {
      grok {
        match => { 
          "message" => "\[BLOCKCHAIN\] Block %{NUMBER:block_number:int} - Confirmations: %{NUMBER:confirmations:int} - Status: %{WORD:block_status}" 
        }
        add_tag => ["blockchain_event"]
      }
    }
  }
  
  # Security log processing
  if [type] == "security-logs" or [fields][service] == "security" {
    # Parse authentication events
    if [message] =~ /\[AUTH\]/ {
      grok {
        match => { 
          "message" => "\[AUTH\] %{WORD:auth_event} - User: %{DATA:user_id} - IP: %{IP:client_ip} - Method: %{WORD:auth_method} - Result: %{WORD:auth_result}" 
        }
        add_tag => ["authentication"]
      }
      
      # Detect failed authentication attempts
      if [auth_result] == "failed" or [auth_result] == "FAILED" {
        mutate {
          add_tag => ["auth_failure"]
        }
      }
    }
    
    # Parse suspicious activity
    if [message] =~ /\[SUSPICIOUS\]/ {
      grok {
        match => { 
          "message" => "\[SUSPICIOUS\] Activity detected - Type: %{DATA:activity_type} - User: %{DATA:user_id} - IP: %{IP:client_ip} - Severity: %{WORD:severity}" 
        }
        add_tag => ["suspicious_activity"]
      }
    }
    
    # Parse rate limiting events
    if [message] =~ /\[RATE_LIMIT\]/ {
      grok {
        match => { 
          "message" => "\[RATE_LIMIT\] Limit exceeded - IP: %{IP:client_ip} - Endpoint: %{DATA:endpoint} - Rate: %{NUMBER:request_rate:float}/min" 
        }
        add_tag => ["rate_limit_exceeded"]
      }
    }
  }
  
  # GeoIP enrichment for client IPs
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
      database => "/usr/share/logstash/geoip/GeoLite2-City.mmdb"
    }
    
    # Remove detailed location for privacy
    mutate {
      remove_field => ["[geoip][latitude]", "[geoip][longitude]"]
    }
  }
  
  # User agent parsing (if present)
  if [user_agent] {
    useragent {
      source => "user_agent"
      target => "ua"
    }
  }
  
  # Add hostname and service information
  mutate {
    add_field => {
      "hostname" => "%{[host][name]}"
      "service" => "%{[fields][service]}"
      "environment" => "${ENVIRONMENT:production}"
    }
  }
  
  # Clean up sensitive information
  if [message] =~ /password|secret|private|signature/ {
    ruby {
      code => "
        message = event.get('message')
        message = message.gsub(/password[=:]\\s*[\"']?[^\\s\"',]+[\"']?/i, 'password=[REDACTED]')
        message = message.gsub(/secret[=:]\\s*[\"']?[^\\s\"',]+[\"']?/i, 'secret=[REDACTED]')
        message = message.gsub(/private[=:]\\s*[\"']?[^\\s\"',]+[\"']?/i, 'private=[REDACTED]')
        message = message.gsub(/signature[=:]\\s*[\"']?[^\\s\"',]+[\"']?/i, 'signature=[REDACTED]')
        event.set('message', message)
      "
    }
  }
  
  # Convert numeric fields
  if [response_time] {
    mutate {
      convert => { "response_time" => "float" }
    }
  }
  
  if [memory_usage] {
    mutate {
      convert => { "memory_usage" => "integer" }
    }
  }
  
  if [cpu_usage] {
    mutate {
      convert => { "cpu_usage" => "float" }
    }
  }
}

output {
  # Send to Elasticsearch with proper index patterns
  elasticsearch {
    hosts => ["elasticsearch-1:9200", "elasticsearch-2:9200", "elasticsearch-3:9200"]
    
    # Dynamic index naming based on log type and date
    index => "swappiq-%{type}-%{+YYYY.MM.dd}"
    
    # Use document type for better organization
    document_type => "_doc"
    
    # Template for index settings
    template_name => "swappiq"
    template => "/usr/share/logstash/templates/swappiq-template.json"
    template_overwrite => true
    
    # Authentication
    user => "${ELASTICSEARCH_USERNAME:elastic}"
    password => "${ELASTICSEARCH_PASSWORD}"
    
    # SSL/TLS configuration
    ssl => true
    ssl_certificate_verification => true
    cacert => "/usr/share/logstash/certs/ca.crt"
    
    # Performance tuning
    workers => 4
    flush_size => 500
    idle_flush_time => 1
  }
  
  # Send critical alerts to separate index
  if "error" in [tags] or "liquidation" in [tags] or "settlement_failure" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch-1:9200", "elasticsearch-2:9200", "elasticsearch-3:9200"]
      index => "swappiq-alerts-%{+YYYY.MM.dd}"
      user => "${ELASTICSEARCH_USERNAME:elastic}"
      password => "${ELASTICSEARCH_PASSWORD}"
      ssl => true
      cacert => "/usr/share/logstash/certs/ca.crt"
    }
  }
  
  # Send security events to security index
  if "authentication" in [tags] or "suspicious_activity" in [tags] or "rate_limit_exceeded" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch-1:9200", "elasticsearch-2:9200", "elasticsearch-3:9200"]
      index => "swappiq-security-%{+YYYY.MM.dd}"
      user => "${ELASTICSEARCH_USERNAME:elastic}"
      password => "${ELASTICSEARCH_PASSWORD}"
      ssl => true
      cacert => "/usr/share/logstash/certs/ca.crt"
    }
  }
  
  # Debug output (only in development)
  if "${ENVIRONMENT:production}" == "development" {
    stdout {
      codec => rubydebug
    }
  }
  
  # Send metrics to external monitoring (optional)
  if "trade_execution" in [tags] or "websocket_metrics" in [tags] {
    http {
      url => "https://metrics-collector.swappiq.com/logstash"
      http_method => "post"
      headers => {
        "Authorization" => "Bearer ${METRICS_API_TOKEN}"
        "Content-Type" => "application/json"
      }
    }
  }
}