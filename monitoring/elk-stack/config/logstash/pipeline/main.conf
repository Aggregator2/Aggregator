# DEX Platform Logstash Pipeline Configuration

input {
  # Beats input for Filebeat
  beats {
    port => 5044
    type => "beats"
  }

  # TCP input for direct log shipping
  tcp {
    port => 5000
    type => "tcp"
    codec => json_lines
  }

  # HTTP input for webhook logs
  http {
    port => 8080
    type => "webhook"
  }

  # Redis input for queued logs
  redis {
    host => "redis"
    port => 6379
    data_type => "list"
    key => "dex_logs"
    type => "redis"
  }
}

filter {
  # Parse timestamp
  if [fields][log_type] {
    mutate {
      add_field => { "service_type" => "%{[fields][log_type]}" }
    }
  }

  # DEX Platform specific parsing
  if [service_type] == "dex-api" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{LOGLEVEL:level}\] %{DATA:component}: %{GREEDYDATA:log_message}"
      }
    }
    
    # Parse API request logs
    if [log_message] =~ /API Request/ {
      grok {
        match => { 
          "log_message" => "API Request - Method: %{WORD:http_method} Path: %{URIPATH:api_path} User: %{DATA:user_id} IP: %{IP:client_ip} Duration: %{NUMBER:request_duration:float}ms"
        }
      }
      
      mutate {
        add_field => { "log_category" => "api_request" }
      }
    }
    
    # Parse trading logs
    if [log_message] =~ /Trade Executed/ {
      grok {
        match => { 
          "log_message" => "Trade Executed - Trade ID: %{DATA:trade_id} Pair: %{DATA:trading_pair} Amount: %{NUMBER:trade_amount:float} Price: %{NUMBER:trade_price:float} User: %{DATA:trader_id}"
        }
      }
      
      mutate {
        add_field => { "log_category" => "trade_execution" }
        add_field => { "business_event" => "trade" }
      }
    }
    
    # Parse order logs
    if [log_message] =~ /Order/ {
      grok {
        match => { 
          "log_message" => "Order %{WORD:order_action} - Order ID: %{DATA:order_id} Type: %{DATA:order_type} Side: %{WORD:order_side} Amount: %{NUMBER:order_amount:float} Price: %{NUMBER:order_price:float} User: %{DATA:user_id}"
        }
      }
      
      mutate {
        add_field => { "log_category" => "order_management" }
        add_field => { "business_event" => "order" }
      }
    }
  }

  # Authentication service logs
  if [service_type] == "auth-service" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{LOGLEVEL:level}\] %{DATA:component}: %{GREEDYDATA:log_message}"
      }
    }
    
    # Parse authentication events
    if [log_message] =~ /Authentication/ {
      grok {
        match => { 
          "log_message" => "Authentication %{WORD:auth_result} - User: %{DATA:user_id} Method: %{DATA:auth_method} IP: %{IP:client_ip} Duration: %{NUMBER:auth_duration:float}ms"
        }
      }
      
      mutate {
        add_field => { "log_category" => "authentication" }
        add_field => { "security_event" => "auth_attempt" }
      }
    }
    
    # Parse security alerts
    if [log_message] =~ /Security Alert/ {
      grok {
        match => { 
          "log_message" => "Security Alert - Type: %{DATA:alert_type} User: %{DATA:user_id} Risk Score: %{NUMBER:risk_score:float} Details: %{GREEDYDATA:alert_details}"
        }
      }
      
      mutate {
        add_field => { "log_category" => "security_alert" }
        add_field => { "security_event" => "threat_detected" }
        add_field => { "alert_priority" => "high" }
      }
    }
  }

  # Matching engine logs
  if [service_type] == "matching-engine" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{LOGLEVEL:level}\] %{DATA:component}: %{GREEDYDATA:log_message}"
      }
    }
    
    # Parse matching events
    if [log_message] =~ /Order Matched/ {
      grok {
        match => { 
          "log_message" => "Order Matched - Taker: %{DATA:taker_order_id} Maker: %{DATA:maker_order_id} Pair: %{DATA:trading_pair} Amount: %{NUMBER:matched_amount:float} Price: %{NUMBER:match_price:float} Latency: %{NUMBER:matching_latency:float}ms"
        }
      }
      
      mutate {
        add_field => { "log_category" => "order_matching" }
        add_field => { "business_event" => "match" }
      }
    }
  }

  # Performance logs
  if [service_type] == "performance" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{LOGLEVEL:level}\] Performance: %{GREEDYDATA:log_message}"
      }
    }
    
    # Parse performance metrics
    if [log_message] =~ /Metric/ {
      grok {
        match => { 
          "log_message" => "Metric - Name: %{DATA:metric_name} Value: %{NUMBER:metric_value:float} Unit: %{DATA:metric_unit} Service: %{DATA:service_name}"
        }
      }
      
      mutate {
        add_field => { "log_category" => "performance_metric" }
        add_field => { "metric_type" => "business_kpi" }
      }
    }
  }

  # Error and exception parsing
  if [level] == "ERROR" or [level] == "FATAL" {
    mutate {
      add_field => { "error_event" => "true" }
    }
    
    # Parse stack traces
    if [log_message] =~ /Exception|Error|Stack/ {
      grok {
        match => { 
          "log_message" => "%{DATA:error_type}: %{GREEDYDATA:error_details}"
        }
      }
      
      mutate {
        add_field => { "log_category" => "error" }
      }
    }
  }

  # Add geolocation for IP addresses
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }

  # Parse user agent
  if [user_agent] {
    useragent {
      source => "user_agent"
      target => "ua"
    }
  }

  # Add environment and service tags
  mutate {
    add_field => { 
      "environment" => "${ENVIRONMENT:production}"
      "platform" => "dex"
      "version" => "${APP_VERSION:1.0.0}"
    }
  }

  # Convert numeric fields
  if [request_duration] {
    mutate {
      convert => { "request_duration" => "float" }
    }
  }

  if [trade_amount] {
    mutate {
      convert => { "trade_amount" => "float" }
    }
  }

  if [trade_price] {
    mutate {
      convert => { "trade_price" => "float" }
    }
  }

  # Calculate trade value
  if [trade_amount] and [trade_price] {
    ruby {
      code => "event.set('trade_value', event.get('trade_amount') * event.get('trade_price'))"
    }
  }

  # Date parsing
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }

  # Remove unwanted fields
  mutate {
    remove_field => [ "host", "agent", "ecs", "input", "log" ]
  }
}

output {
  # Main Elasticsearch output
  elasticsearch {
    hosts => ["elasticsearch-master:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ssl => false
    
    # Index patterns based on log type
    index => "dex-logs-%{service_type}-%{+YYYY.MM.dd}"
    
    # Document templates
    template_name => "dex-logs"
    template => "/usr/share/logstash/templates/dex-logs.json"
    template_overwrite => true
    
    # Manage document IDs for deduplication
    document_id => "%{[@metadata][fingerprint]}"
  }

  # Security events to dedicated index
  if [security_event] {
    elasticsearch {
      hosts => ["elasticsearch-master:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      ssl => false
      index => "dex-security-%{+YYYY.MM.dd}"
    }
  }

  # Business events to dedicated index
  if [business_event] {
    elasticsearch {
      hosts => ["elasticsearch-master:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      ssl => false
      index => "dex-business-%{+YYYY.MM.dd}"
    }
  }

  # Performance metrics to dedicated index
  if [metric_type] == "business_kpi" {
    elasticsearch {
      hosts => ["elasticsearch-master:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      ssl => false
      index => "dex-metrics-%{+YYYY.MM.dd}"
    }
  }

  # Error events to dedicated index
  if [error_event] == "true" {
    elasticsearch {
      hosts => ["elasticsearch-master:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      ssl => false
      index => "dex-errors-%{+YYYY.MM.dd}"
    }
  }

  # High priority alerts to Redis for real-time processing
  if [alert_priority] == "high" {
    redis {
      host => "redis"
      port => 6379
      data_type => "list"
      key => "dex_alerts"
    }
  }

  # Debug output for development
  if "${LOG_DEBUG}" == "true" {
    stdout {
      codec => rubydebug
    }
  }
}