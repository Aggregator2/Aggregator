#################################### Generic OAuth ##########################
[auth.generic_oauth]
enabled = false
name = OAuth
allow_sign_up = true
client_id = some_id
client_secret = some_secret
scopes = user:email,read:org
email_attribute_name = email:primary
email_attribute_path = email
login_attribute_path = login
name_attribute_path = name
id_token_attribute_name =
