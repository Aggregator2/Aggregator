;; PgBouncer configuration for high-frequency trading system
;; Optimized for maximum performance and connection efficiency

[databases]
;; Main trading database with session pooling for transactions
trading = host=localhost port=5432 dbname=trading auth_user=pgbouncer

;; Read replica for analytics queries
trading_read = host=localhost port=5433 dbname=trading auth_user=pgbouncer

;; Dedicated pool for order matching engine
trading_matching = host=localhost port=5432 dbname=trading auth_user=pgbouncer pool_mode=transaction

;; Dedicated pool for market data updates
trading_market = host=localhost port=5432 dbname=trading auth_user=pgbouncer pool_mode=transaction

[pgbouncer]
;; Connection settings
listen_addr = *
listen_port = 6432
unix_socket_dir = /var/run/pgbouncer
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; Pool settings optimized for high-frequency trading
pool_mode = session
max_client_conn = 10000
default_pool_size = 100
min_pool_size = 20
reserve_pool_size = 25
reserve_pool_timeout = 5
max_db_connections = 1000
max_user_connections = 1000

;; Performance optimizations
server_round_robin = 1
ignore_startup_parameters = extra_float_digits

;; Timeouts
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
client_login_timeout = 60
client_idle_timeout = 0

;; Query settings
query_timeout = 300
query_wait_timeout = 120
cancel_wait_timeout = 10

;; Low-level tuning
pkt_buf = 4096
tcp_socket_buffer = 0
tcp_defer_accept = 1
tcp_keepalive = 1
tcp_keepcnt = 3
tcp_keepidle = 60
tcp_keepintvl = 10

;; Logging
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
admin_users = postgres, admin
stats_users = stats, postgres, admin
stats_period = 60
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

;; Security
server_tls_sslmode = prefer
server_tls_protocols = secure
server_tls_ciphers = HIGH:MEDIUM:+3DES:!aNULL

;; Monitoring
application_name_add_host = 1

[users]
;; User-specific settings
app_user = pool_mode=transaction max_user_connections=500
analytics_user = pool_mode=session max_user_connections=50
admin = pool_mode=session max_user_connections=10